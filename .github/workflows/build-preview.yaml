name: build-preview
run-name: build pull request preview

on:
  # run when called from another workflow
  workflow_call:

  # run if user manually requests it
  workflow_dispatch:

# variables
env:
  PREVIEWS_FOLDER: preview

permissions:
  contents: write
  pull-requests: write

jobs:
  build-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Debug dump
        uses: crazy-max/ghaction-dump-context@v2

      - name: Checkout branch contents
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}

      - name: Install Ruby packages
        if: github.event.action != 'closed'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      # ubuntu-24.04 runners no longer ship ImageMagick, which mini_magick
      # shells out to. Without it _plugins/image_thumbnails.rb generates
      # nothing and every portrait is served at full size.
      - name: Install ImageMagick
        if: github.event.action != 'closed'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick

      - name: Cache generated portrait thumbnails
        if: github.event.action != 'closed'
        uses: actions/cache@v4
        with:
          path: .jekyll-cache/thumbs
          key: jekyll-thumbs-${{ hashFiles('images/people/**', '_members/**', '_plugins/image_thumbnails.rb') }}
          restore-keys: |
            jekyll-thumbs-

      - name: Get Pages url
        if: github.event.action != 'closed'
        id: pages
        uses: actions/configure-pages@v4

      - uses: jwalton/gh-find-current-pr@master
        if: github.event.action != 'closed'
        id: pr
        with:
          state: all

      - name: SSH debug
        if: runner.debug == '1'
        uses: mxschmitt/action-tmate@v3

      - name: Build preview version of site
        if: github.event.action != 'closed'
        run: |
          JEKYLL_ENV=production bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path || '' }}/${{ env.PREVIEWS_FOLDER }}/pr-${{ env.pr }}"
        env:
          pr: ${{ steps.pr.outputs.pr }}

      # The generator degrades quietly when it cannot resize, so assert the
      # thumbnails actually exist rather than trusting a green build.
      - name: Verify portrait thumbnails were generated
        if: github.event.action != 'closed'
        run: |
          count=$(find _site/images/thumbs -name '*.webp' 2>/dev/null | wc -l)
          echo "Generated $count portrait thumbnails."
          if [ "$count" -eq 0 ]; then
            echo "::error::No portrait thumbnails were generated - every portrait will load at full size. Check that ImageMagick is installed and _plugins/image_thumbnails.rb is working."
            exit 1
          fi

      - name: Commit preview to Pages branch
        uses: rossjrw/pr-preview-action@v1.4.7
        with:
          source-dir: _site
          umbrella-dir: ${{ env.PREVIEWS_FOLDER }}
