# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Rebuilds daily so the profile view counts baked in at build time
  # (see _analytics/fetch_views.py) don't go stale between pushes
  schedule:
    - cron: "30 5 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1 # v1.161.0
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      # ubuntu-24.04 runners no longer ship ImageMagick, which mini_magick
      # shells out to. Without it _plugins/image_thumbnails.rb generates
      # nothing and every portrait is served at full size.
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          # Not --no-install-recommends: ImageMagick's WebP delegate ships in
          # libmagickcore-*-extra, which is only Recommended. Without it the
          # binary installs fine but cannot write the .webp this plugin needs.
          sudo apt-get install -y imagemagick
          if ! convert -list format | grep -qi 'webp'; then
            echo "::error::ImageMagick installed without a WebP delegate; thumbnails cannot be written."
            exit 1
          fi
          convert -version | head -1

      - name: Cache generated portrait thumbnails
        uses: actions/cache@v4
        with:
          path: .jekyll-cache/thumbs
          key: jekyll-thumbs-${{ hashFiles('images/people/**', '_members/**', '_plugins/image_thumbnails.rb') }}
          restore-keys: |
            jekyll-thumbs-
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Reads per-profile pageview totals back out of Umami into
      # _data/views.yaml so they render as static HTML. No-ops without the
      # UMAMI_API_KEY secret, and never blocks a deploy.
      - name: Fetch profile view counts
        continue-on-error: true
        timeout-minutes: 3
        run: python _analytics/fetch_views.py
        env:
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # The generator degrades quietly when it cannot resize, so assert the
      # thumbnails actually exist rather than trusting a green build.
      - name: Verify portrait thumbnails were generated
        run: |
          count=$(find _site/images/thumbs -name '*.webp' 2>/dev/null | wc -l)
          echo "Generated $count portrait thumbnails."
          if [ "$count" -eq 0 ]; then
            echo "::error::No portrait thumbnails were generated - every portrait will load at full size. Check that ImageMagick is installed and _plugins/image_thumbnails.rb is working."
            exit 1
          fi
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
