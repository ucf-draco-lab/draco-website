name: build-site
run-name: build live site

on:
  # run when called from another workflow
  workflow_call:

  # run if user manually requests it
  workflow_dispatch:

# variables
env:
  PREVIEWS_FOLDER: preview

permissions:
  contents: write

jobs:
  build-site:
    runs-on: ubuntu-latest

    steps:
      - name: Debug dump
        uses: crazy-max/ghaction-dump-context@v2

      - name: Checkout branch contents
        uses: actions/checkout@v4

      - name: Install Ruby packages
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      # ubuntu-24.04 runners no longer ship ImageMagick, which mini_magick
      # shells out to. Without it _plugins/image_thumbnails.rb generates
      # nothing and every portrait is served at full size.
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick

      - name: Cache generated portrait thumbnails
        uses: actions/cache@v4
        with:
          path: .jekyll-cache/thumbs
          key: jekyll-thumbs-${{ hashFiles('images/people/**', '_members/**', '_plugins/image_thumbnails.rb') }}
          restore-keys: |
            jekyll-thumbs-

      - name: Get Pages url
        id: pages
        uses: actions/configure-pages@v4

      - name: SSH debug
        if: runner.debug == '1'
        uses: mxschmitt/action-tmate@v3

      - name: Set root url
        run: |
          printf "\n\nurl: ${{ steps.pages.outputs.origin }}" >> _config.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Reads per-profile pageview totals back out of Umami into
      # _data/views.yaml so they can render as static HTML. No-ops without the
      # UMAMI_API_KEY secret, and never blocks a deploy.
      - name: Fetch profile view counts
        continue-on-error: true
        timeout-minutes: 3
        run: python _analytics/fetch_views.py
        env:
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}

      - name: Build live version of site
        run: |
          JEKYLL_ENV=production bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path || '' }}"

      # The generator degrades quietly when it cannot resize, so assert the
      # thumbnails actually exist rather than trusting a green build.
      - name: Verify portrait thumbnails were generated
        run: |
          count=$(find _site/images/thumbs -name '*.webp' 2>/dev/null | wc -l)
          echo "Generated $count portrait thumbnails."
          if [ "$count" -eq 0 ]; then
            echo "::error::No portrait thumbnails were generated - every portrait will load at full size. Check that ImageMagick is installed and _plugins/image_thumbnails.rb is working."
            exit 1
          fi

      - name: Commit live site to Pages branch
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          folder: _site
          clean-exclude: ${{ env.PREVIEWS_FOLDER }}
          force: false
