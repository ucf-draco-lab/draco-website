<svg xmlns="http://www.w3.org/2000/svg" viewBox="45 -10 220 220" role="img">
  <title>Project LATTE</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A2C1B"/>
      <stop offset="1" stop-color="#2B190F"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.3" fill="#F7EFE3" fill-opacity=".10"/>
    </pattern>
    <pattern id="foamdots" width="9" height="6" patternUnits="userSpaceOnUse" patternTransform="translate(150 90)">
      <circle cx="4.5" cy="3" r="1.25" fill="#9B6234"/>
    </pattern>
    <clipPath id="foamclip"><ellipse cx="150" cy="90" rx="47" ry="7.5"/></clipPath>
  </defs>
  <rect x="45" y="-10" width="220" height="220" fill="url(#bg)"/>
  <rect x="45" y="-10" width="220" height="220" fill="url(#grid)"/>

  <!-- steam: two soft wisps and a gold power trace in the middle -->
  <path d="M126 74 C120 64 132 58 126 46 C121 37 129 31 127 24" fill="none" stroke="#F7EFE3" stroke-opacity=".45" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M174 74 C180 64 168 58 174 46 C179 37 171 31 173 24" fill="none" stroke="#F7EFE3" stroke-opacity=".45" stroke-width="3.2" stroke-linecap="round"/>
  <polyline points="150,76 150,68 145,64 155,58 147,53 150,49 150,44 141,38 159,30 150,26 150,16" fill="none" stroke="#EDB80D" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="150" cy="16" r="3.4" fill="#EDB80D"/>

  <!-- saucer -->
  <ellipse cx="150" cy="166" rx="80" ry="13" fill="#E3D2BB"/>
  <ellipse cx="150" cy="163" rx="58" ry="7" fill="#CDB89C"/>

  <!-- handle -->
  <path d="M203 104 C232 102 234 140 201 140" fill="none" stroke="#F7EFE3" stroke-width="10" stroke-linecap="round"/>

  <!-- mug body -->
  <path d="M96 90 H204 V126 Q204 164 166 164 H134 Q96 164 96 126 Z" fill="#F7EFE3"/>
  <path d="M96 90 H110 V128 Q110 154 130 162 Q96 158 96 126 Z" fill="#E8DCCB"/>

  <!-- coffee rim and lattice foam -->
  <ellipse cx="150" cy="90" rx="54" ry="11" fill="#F7EFE3"/>
  <ellipse cx="150" cy="90" rx="50" ry="9" fill="#B87A45"/>
  <ellipse cx="150" cy="90" rx="47" ry="7.5" fill="#EBD3B0"/>
  <rect x="100" y="80" width="100" height="20" fill="url(#foamdots)" clip-path="url(#foamclip)"/>

  <!-- face -->
  <circle cx="133" cy="122" r="4.6" fill="#2B190F"/>
  <circle cx="167" cy="122" r="4.6" fill="#2B190F"/>
  <circle cx="134.6" cy="120.4" r="1.5" fill="#FFFFFF"/>
  <circle cx="168.6" cy="120.4" r="1.5" fill="#FFFFFF"/>
  <ellipse cx="121" cy="133" rx="6" ry="3.6" fill="#F2A7A0" fill-opacity=".85"/>
  <ellipse cx="179" cy="133" rx="6" ry="3.6" fill="#F2A7A0" fill-opacity=".85"/>
  <path d="M141 131 Q150 140 159 131" fill="none" stroke="#2B190F" stroke-width="3.2" stroke-linecap="round"/>

  <!-- the dragon's star -->
  <path d="M244 40 l2.6 6.4 6.4 2.6 -6.4 2.6 -2.6 6.4 -2.6 -6.4 -6.4 -2.6 6.4 -2.6 z" fill="#EDB80D"/>
  <circle cx="226" cy="28" r="1.8" fill="#F7EFE3" fill-opacity=".7"/>
  <circle cx="262" cy="64" r="1.6" fill="#F7EFE3" fill-opacity=".6"/>
</svg>
