    navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {});
  }

  // a key remembered from an earlier unlock opens the page straight away
  var saved = get("localStorage") || get("sessionStorage");
  if (saved) open(saved).catch(function () { drop(); msg.textContent = ""; });

  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var remember = document.getElementById("remember").checked;
    go.disabled = true; msg.className = "msg"; msg.textContent = "Unlocking…";
    derive(pw.value).then(function (raw) {
      return open(raw).then(function () {
        put("sessionStorage", raw);
        if (remember) put("localStorage", raw);
      }, function () { throw new Error("bad"); });
    }).catch(function () {
      go.disabled = false; msg.className = "msg err"; msg.textContent = "That password didn't work.";
      pw.select();
    });
  });
})();
</script>
</body>
</html>
