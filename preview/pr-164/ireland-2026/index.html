input[type=password]:focus { border-color: var(--gold); }

button[disabled] { opacity: .6; cursor: progress; }
.opt { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-size: 14px; color: var(--muted); }
.opt input { accent-color: var(--gold); width: 18px; height: 18px; margin: 0; }
.msg { min-height: 1.6em; margin-top: 12px; font-size: 14px; }
.msg.err { color: var(--err); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
footer { margin-top: 28px; font-size: 12.5px; color: var(--muted); }
