# site properties and page defaults
title: DRACO
subtitle: Design of Resilient Architectures for Computing
description: "DRACO Lab at UCF: applied research in hardware security, side channel analysis, and resilient computing — from logic gates to autonomous systems."
url: "https://thedracolab.com"
header: images/2025-draco-par-team.jpg
footer: images/Reflection_Pond_01.jpg
proofer: false

# site social media and other links
links:
  email: mike.borowczak@ucf.edu
  orcid: 0000-0001-9409-8245
  google-scholar: h0M0TmsAAAAJ

# privacy-friendly analytics (umami). The website id is also what
# _analytics/fetch_views.py needs as UMAMI_WEBSITE_ID to read per-profile
# view counts back out — see _analytics/README.md.
analytics:
  umami_website_id: 2176cef2-57af-4fcf-b220-7b2050b694c3
  umami_script: https://cloud.umami.is/script.js

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post
  # markdown files in /_projects
  - scope:
      type: "projects"
    values:
      layout: project

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true
  # generate page for each post
  projects:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# jekyll-spaceship processors.
#
# table-processor is left out deliberately. It re-parses and re-serialises every
# <table> on a page, and it mangles void elements while doing so: the <source>
# inside the alumni table's <picture> came back out as
# "<source ...></source>&lt;/source&gt;", rendering a literal "</source>" in each
# row. Nothing here uses its extended table syntax (rowspan/colspan/multiline);
# ordinary markdown tables are kramdown's job and are unaffected.
jekyll-spaceship:
  processors:
    - mathjax-processor
    - plantuml-processor
    - mermaid-processor
    - polyfill-processor
    - media-processor
    - emoji-processor
    - element-processor

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
  - _bibliography
  # internal working notes, not site content
  - AIRTABLE_SYNC.md
