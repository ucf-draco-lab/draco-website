  var msg = document.getElementById("msg"), go = document.getElementById("go"), pw = document.getElementById("pw");
  function bytes(b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  function b64(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function get(store) { try { return window[store].getItem("ie26.k"); } catch (e) { return null; } }
  function put(store, v) { try { window[store].setItem("ie26.k", v); } catch (e) {} }
  function drop() { try { localStorage.removeItem("ie26.k"); sessionStorage.removeItem("ie26.k"); } catch (e) {} }

  if (!(window.crypto && crypto.subtle && window.TextDecoder)) {
    msg.className = "msg err"; msg.textContent = "This browser can't unlock the page. Try a current version of Safari, Chrome, Edge, or Firefox.";

  }
  var data = bytes(P.data), iv = data.slice(0, 12), ct = data.slice(12);

  function open(rawB64) {
    return crypto.subtle.importKey("raw", bytes(rawB64), "AES-GCM", false, ["decrypt"])
      .then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, k, ct); })
      .then(function (pt) {
        var html = new TextDecoder().decode(pt).replace("__IE26KEY__", function () { return rawB64; });

        var off = document.getElementById("ie26-offline");
        if (off) html = html.replace("<!-" + "-IE26OFFLINE--" + ">", function () { return "<scr" + 'ipt id="ie26-offline" type="application/json">' + off.textContent + "</scr" + "ipt>"; });

      });
  }

    return crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"])

      .then(b64);
