button[disabled] { opacity: .6; cursor: progress; }
.opt { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-size: 14px; color: var(--muted); }
.opt input { accent-color: var(--gold); width: 18px; height: 18px; margin: 0; }
.msg { min-height: 1.6em; margin-top: 12px; font-size: 14px; }
.msg.err { color: var(--err); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
footer { margin-top: 28px; font-size: 12.5px; color: var(--muted); }

  function b64(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function get(store) { try { return window[store].getItem("ie26.k"); } catch (e) { return null; } }
  function put(store, v) { try { window[store].setItem("ie26.k", v); } catch (e) {} }
  function drop() { try { localStorage.removeItem("ie26.k"); sessionStorage.removeItem("ie26.k"); } catch (e) {} }

  if (!(window.crypto && crypto.subtle && window.TextDecoder)) {
    msg.className = "msg err"; msg.textContent = "This browser can't unlock the page. Try a current version of Safari, Chrome, Edge, or Firefox.";
    go.disabled = true; return;
  }
  var data = bytes(P.data), iv = data.slice(0, 12), ct = data.slice(12);

  function open(rawB64) {
    return crypto.subtle.importKey("raw", bytes(rawB64), "AES-GCM", false, ["decrypt"])
      .then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, k, ct); })
      .then(function (pt) {
        var html = new TextDecoder().decode(pt).replace("__IE26KEY__", rawB64);
        document.open(); document.write(html); document.close();
      });
  }
  function derive(password) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"])
      .then(function (base) { return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: bytes(P.salt), iterations: P.iter }, base, 256); })
      .then(b64);
  }

  // a key remembered from an earlier unlock opens the page straight away
  var saved = get("localStorage") || get("sessionStorage");
  if (saved) open(saved).catch(function () { drop(); msg.textContent = ""; });

  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var remember = document.getElementById("remember").checked;
    go.disabled = true; msg.className = "msg"; msg.textContent = "Unlocking…";
    derive(pw.value).then(function (raw) {
      return open(raw).then(function () {
        put("sessionStorage", raw);
        if (remember) put("localStorage", raw);
      }, function () { throw new Error("bad"); });
    }).catch(function () {
      go.disabled = false; msg.className = "msg err"; msg.textContent = "That password didn't work.";
      pw.select();
    });
  });
})();
</script>
</body>
