# Named scholar programs, fellowships, and awards a team member can be tagged
# with. Reference one from a member's frontmatter by its key here:
#
#   awards: [northrop-grumman-scholar]
#
# Each award renders as a badge (logo + words) on the member's profile page,
# and as a compact pill on their team-page portrait.
#
#   name     full label, used on the profile page badge
#   short    abbreviated label, used on the compact portrait pill
#   image    logo shown alongside the label
#   sponsor  slug of a sponsor member page to link the badge to (optional)
#   link     external URL, used only when `sponsor` is unset (optional)
#   tooltip  hover text (optional)
#   logo_style  set to "wordmark" for a wide logo (e.g. AMD) — see
#               _styles/awards.scss; the default suits a square mark
#
# A member who held an award in the past lists it under `former_awards:`
# instead, and the badge picks up the `former_*` wording below.

northrop-grumman-scholar:
  name: Northrop Grumman Scholar
  short: NG Scholar
  image: images/sponsors/ng-square.png
  sponsor: northrop-grumman
  link: https://www.northropgrumman.com
  tooltip: Selected for UCF's Northrop Grumman Scholars Program
  former_name: Former Northrop Grumman Scholar
  former_short: Former NG Scholar
  former_tooltip: Alum of UCF's Northrop Grumman Scholars Program

# The AMD logo is a wide black wordmark on a transparent square canvas, so it
# gets the "wordmark" treatment: a light plate (the mark is black) rendered at
# its own aspect rather than squeezed into the square badge slot.
#
# UCF runs two AMD fellowships — an undergraduate one and a graduate one — and
# DRACO has had fellows in both. "AMD Research Fellow" is the umbrella the lab's
# own posts use, so one entry covers both rather than splitting the badge.
amd-scholar:
  name: AMD Scholar
  short: AMD Scholar
  image: images/sponsors/amd.png
  logo_style: wordmark
  sponsor: amd
  link: https://www.amd.com
  tooltip: Selected for UCF's AMD Scholars Program
  former_name: Former AMD Scholar
  former_short: Former AMD Scholar
  former_tooltip: Alum of UCF's AMD Scholars Program
