# DRACO research projects.
#
# This file is the card index for /projects. Every entry in `group: active`
# has a matching page in _projects/, and `link` points at it.
#
# Six pages carry `poster` and `poster_caption` in their front matter. Nothing
# renders them any more — the layout used to embed the figure at the top of the
# page and no longer does. The keys are kept as the record of which poster
# belongs to which project, and of what a couple of the captions say about a
# project's earlier phase.
#
# `group: completed` entries render under "Past Projects". Some of those still
# have pages (the ones a student wrote up); the rest are card-only.
#
# Senior design lives in _data/senior_design.yaml and renders on /senior-design.
#
# `sponsor` holds member slugs from _members/ (amd, awn, leidos, ucf, ...).
# Corridor matching funds are described in the project's page, not here.

# ------------------------------------------------------------------ active

- title: SHARKS
  subtitle: Bio-Inspired Swarm Coordination for Contested Missions
  image: images/projects/sharks.jpg
  link: projects/sharks.html
  description: Biology coordinates groups with no leader, no clock, and no reliable channel — and it does it while under attack. SHARKS translates those mechanisms into swarm algorithms, tests them across a portfolio of missions rather than a single task, and measures what an adversary inside the group can do to each one.
  sponsor: [ucf]
  group: active
  tags:
    - research
    - available
    - undergraduate-research-spots
    - graduate-research-spots

- title: PUPS
  subtitle: Platform for Untethered Payload Swarms
  image: images/projects/pups.jpg
  link: projects/pups.html
  description: The airframe and edge-compute platform the swarm algorithms fly on. PUPS trades payload against endurance and onboard compute to give SHARKS a real testbed instead of a simulator, with telemetry good enough to reproduce a run.
  sponsor: [ucf]
  group: active
  tags:
    - research
    - available
    - undergraduate-research-spots
    - graduate-research-spots

- title: Shadow AI
  subtitle: Workload Detection Through Side Channel Analysis
  image: images/projects/shadow_ai.jpg
  link: projects/shadow-ai.html
  description: Hardware leaks what software is doing. Shadow AI fingerprints workloads from power and electromagnetic side channels alone, without instrumenting the host — identifying what is running on a machine you do not control.
  sponsor: [awn]
  group: active
  tags:
    - research
    - available
    - undergraduate-research-spots
    - graduate-research-spots

- title: Trace-AI
  subtitle: Provenance and Attribution for AI Workloads
  image: images/projects/trace-ai.jpg
  link: projects/trace-ai.html
  description: Given an observed artifact or signal, which model produced it? Trace-AI carries Shadow AI's fingerprinting from what is running to what ran, building attribution evidence that survives the gap between execution and observation.
  sponsor: [awn]
  group: active
  tags:
    - research
    - available
    - undergraduate-research-spots
    - graduate-research-spots

- title: Aegis
  subtitle: AI Model Exfiltration and Protection Through Side Channel Analysis
  image: images/projects/aegis.jpg
  link: projects/aegis.html
  description: Edge ML accelerators leak their models. Aegis measures how much of a deployed network — architecture, weights, inputs — an attacker can recover from side channels alone, then builds the countermeasures that close the gap.
  sponsor: [leidos]
  group: active
  tags:
    - research
    - available
    - undergraduate-research-spots
    - graduate-research-spots

- title: RTL Insight
  subtitle: Static Analysis for RTL
  image: images/projects/rtl-insight.jpg
  link: projects/rtl-insight.html
  description: Verilog hides its own dataflow. RTL Insight builds on Yosys to extract, analyze, and visualize the structure of large designs, giving engineers a way to reason about logic that has outgrown what anyone can read top to bottom.
  sponsor: [amd]
  group: active
  tags:
    - research
    - available
    - undergraduate-research-spots
    - graduate-research-spots

- title: Dark Logic
  subtitle: Complexity Reduction for Formal Verification
  image: images/projects/dark_logic.webp
  link: projects/dark-logic.html
  description: Formal verification stalls on state explosion long before it reaches production-scale RTL. Dark Logic attacks that cost directly — abstraction, decomposition, and invariant discovery that shrink what model checkers and theorem provers must actually prove.
  sponsor: [ucf]
  group: active
  tags:
    - research
    - available
    - undergraduate-research-spots
    - graduate-research-spots

- title: Dark Matter
  subtitle: Analog and Mixed-Signal Trojans
  image: images/projects/dark-matter.jpg
  link: projects/dark-matter.html
  description: Digital verification never looks at the PLL. Dark Matter studies malicious modification hidden in analog and mixed-signal blocks — clocking, data conversion, power management — where the digital toolchain is structurally blind.
  group: active
  tags:
    - research
    - available
    - undergraduate-research-spots
    - graduate-research-spots

- title: CHIRP
  subtitle: Ultra-Lightweight IoT Communication
  image: images/projects/chirp.webp
  link: projects/chirp.html
  description: A peer-to-peer IoT network built on the CHIRP communication algorithm, aimed at devices too small for a conventional stack. We are measuring what the protocol costs in power, memory, and latency once it leaves simulation and lands on real radios.
  sponsor: [ucf]
  group: active
  tags:
    - research
    - available
    - undergraduate-research-spots
    - graduate-research-spots

- title: Encrypted Processor Framework & Accelerator
  subtitle: A Framework for Fast, Secure Processing
  image: images/projects/epfa.webp
  link: projects/encrypted-processor.html
  description: A modified cryptosystem that permits computation directly on encrypted data, paired with the accelerator that makes it practical. The target is stronger than computing on plaintext and fast enough that fully homomorphic encryption is not the only option.
  group: active
  tags:
    - research
    - available
    - undergraduate-research-spots
    - graduate-research-spots

- title: Side-Channel-Resistant Computer Architecture
  subtitle: Partially Homomorphic Execution in Real Hardware
  image: images/projects/SHARE.jpeg
  link: projects/side-channel-resistant-architecture.html
  description: Building on the E3X ISA for partially homomorphic execution, we are moving side-channel-resistant architecture off the simulator and into hardware — where timing, power, and area decide whether the guarantees survive contact with silicon.
  group: active
  tags:
    - research
    - available
    - undergraduate-research-spots
    - graduate-research-spots

- title: Signal Insight
  subtitle: Information Theory for Power Estimation and Optimization
  image: images/projects/signal_insight.png
  link: projects/signal-insight.html
  description: Entropy is a cheap proxy for switching activity. Signal Insight tests how far information-theoretic measures can substitute for simulation in estimating power, and whether the same measures can steer optimization rather than only report on it.
  group: active
  tags:
    - research
    - available
    - undergraduate-research-spots
    - graduate-research-spots

- title: Polymorphic Encrypted Components
  subtitle: Building Blocks That Never Look the Same Twice
  image: images/projects/poly.jpg
  link: projects/polymorphic-components.html
  description: Borrowed from malware evasion — fundamental logic components that compute standard operations under a continuously changing key, so the implementation an attacker profiles is never the implementation that runs next.
  group: active
  tags:
    - research
    - available
    - undergraduate-research-spots
    - graduate-research-spots

